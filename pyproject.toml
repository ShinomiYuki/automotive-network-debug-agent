# 本文件负责定义 Python 项目的基础元数据与依赖。
# Trace 与 Config MCP 共享同一 Python 包；Config Core 只使用标准库，不新增依赖。

[project]
name = "automotive-network-debug-agent"
version = "0.5.0"
description = "A Multi-Source Engineering Data-Driven Agent for Automotive Network Fault Diagnosis"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.4",
    "cantools>=39.4",
    "fastmcp>=2.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
canoe = [
    # TODO：后续 CANoe MCP 实现时补充 py-canoe 等依赖。
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# 源码已随插件迁入嵌套目录；显式告诉 Ruff 源码根目录，确保 `anda` 仍按
# first-party 包分组，避免迁移后把现有测试中的导入错误识别为第三方依赖。
[tool.ruff]
src = ["plugins/automotive-network-debug-agent/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 运行源码随 Codex Plugin 一起分发；根目录继续保留测试、文档和工程元数据。
[tool.setuptools.packages.find]
where = ["plugins/automotive-network-debug-agent/src"]
